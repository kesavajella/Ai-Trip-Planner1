# ============================================
# Production Profile - TiDB Cloud + Firebase
# ============================================

# TiDB Cloud (MySQL-compatible)
# IMPORTANT: DATABASE_URL must be a full JDBC URL, e.g.
#   jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/aitripplanner?useSSL=true&requireSSL=true&verifyServerCertificate=true&enabledTLSProtocols=TLSv1.2
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.data-source-properties.useSSL=true
spring.datasource.hikari.data-source-properties.requireSSL=true
spring.datasource.hikari.data-source-properties.verifyServerCertificate=true
spring.datasource.hikari.data-source-properties.enabledTLSProtocols=TLSv1.2,TLSv1.3

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# TiDB SSL CA (optional - set path if required)
# javax.net.ssl.trustStore=/path/to/ca.pem

# Disable H2 console and H2 database entirely in production
spring.h2.console.enabled=false
spring.datasource.hikari.data-source-properties.DB_CLOSE_DELAY=-1

# Firebase
firebase.config.json=${FIREBASE_CONFIG_JSON:}

# Mail (for password reset)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App URL (for reset links)
app.url=${APP_URL:https://ai-trip-planner-1-x26d.onrender.com}

# Gemini API timeouts (ms)
app.gemini.connect-timeout-ms=10000
app.gemini.read-timeout-ms=30000
# Gemini model (flash models have higher free-tier RPM/TPM limits)
app.gemini.model=gemini-flash-latest
# Retry logic for 429 (RESOURCE_EXHAUSTED) rate-limit errors
app.gemini.max-retries=3
app.gemini.initial-delay-ms=2000

