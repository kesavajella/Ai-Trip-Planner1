# ============================================
# intellitrip - AI Trip Planner Application
# ============================================

# Server
server.port=8080

# Application Name
spring.application.name=intellitrip

# ============================================
# Database Configuration
# ============================================
# Dev: H2 file-based for persistence across restarts
spring.datasource.url=jdbc:h2:file:./data/intellitrip
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/schema.sql

# ============================================
# Thymeleaf
# ============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# ============================================
# Static Resources
# ============================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ============================================
# Gemini API (set API key via environment variable)
# ============================================
# GEMINI_API_KEY=your-key-here
# Model to use for generation. The "flash" models have higher RPM/TPM limits on the free tier.
app.gemini.model=gemini-flash-latest
app.gemini.connect-timeout-ms=10000
app.gemini.read-timeout-ms=30000
# Retry logic for 429 (RESOURCE_EXHAUSTED) rate-limit errors
app.gemini.max-retries=3
app.gemini.initial-delay-ms=2000

# ============================================
# File Uploads
# ============================================
spring.servlet.multipart.enabled=false

# ============================================
# Session Management
# ============================================
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# ============================================
# Location Data (countries + states + cities)
# ============================================
# Path to the comprehensive locations JSON used for autocomplete.
# Defaults to static/data/ on the classpath.
app.locations.json-path=static/data/countries+states+cities.json

# ============================================
# Frankfurter Exchange Rate API
# ============================================
# Base: USD — get live rates for all currencies relative to USD.
app.frankfurter.api-url=https://api.frankfurter.dev/v1/latest?base=USD
# How often (ms) to refresh the cached rates from Frankfurter.
app.frankfurter.refresh-interval-ms=3600000

# ============================================
# Logging
# ============================================
logging.level.com.intellitrip=DEBUG
logging.level.org.springframework.security=INFO

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

