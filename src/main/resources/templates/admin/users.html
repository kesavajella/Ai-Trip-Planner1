<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="bg-background">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users - intellitrip</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/output.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-background text-foreground font-sans antialiased">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/sidebar-nav :: sidebar-nav(active='dashboard')}"></div>
    <div class="flex-1 flex flex-col">
        <div th:replace="~{fragments/topbar :: topbar(title='Users', subtitle='Manage user accounts and permissions.')}"></div>
        <div class="flex-1 px-4 py-8 md:px-8">
            <!-- Users Table -->
            <div class="rounded-3xl border border-border bg-card overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b border-border bg-muted/50">
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">Name</th>
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">Email</th>
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">Status</th>
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">Role</th>
                                <th class="px-5 py-4 text-right font-medium text-muted-foreground">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}" class="border-b border-border last:border-0 hover:bg-muted/30 transition-colors">
                                <td class="px-5 py-4">
                                    <div class="flex items-center gap-3">
                                        <span class="grid h-9 w-9 place-items-center rounded-full bg-primary/10 text-primary text-sm font-medium" th:text="${#strings.substring(u.name, 0, 1)}"></span>
                                        <span class="font-medium" th:text="${u.name}">Name</span>
                                    </div>
                                </td>
                                <td class="px-5 py-4 text-muted-foreground" th:text="${u.email}">email@example.com</td>
                                <td class="px-5 py-4">
                                    <span th:class="${u.status == 'active'} ? 'inline-flex items-center rounded-full border border-accent/30 bg-accent/20 px-2.5 py-0.5 text-xs font-medium text-accent-foreground' : 'inline-flex items-center rounded-full border border-destructive/30 bg-destructive/10 px-2.5 py-0.5 text-xs font-medium text-destructive'" th:text="${u.status}">active</span>
                                </td>
                                <td class="px-5 py-4">
                                    <span th:if="${u.admin}" class="inline-flex items-center rounded-full border border-primary/30 bg-primary/10 px-2.5 py-0.5 text-xs font-medium text-primary">Admin</span>
                                    <span th:unless="${u.admin}" class="text-muted-foreground text-xs">User</span>
                                </td>
                                <td class="px-5 py-4 text-right">
                                    <div class="flex items-center justify-end gap-2">
                                        <form th:action="@{/admin/users/status/{id}(id=${u.id})}" method="post">
                                            <button type="submit" th:class="${u.status == 'active'} ? 'inline-flex items-center rounded-full px-3 py-1.5 text-xs font-medium border border-destructive/30 text-destructive hover:bg-destructive/10 transition-colors' : 'inline-flex items-center rounded-full px-3 py-1.5 text-xs font-medium border border-accent/30 text-accent-foreground hover:bg-accent/20 transition-colors'"
                                                    th:text="${u.status == 'active'} ? 'Suspend' : 'Activate'"></button>
                                        </form>
                                        <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Delete this user and all their data?')">
                                            <button type="submit" class="inline-flex items-center rounded-full px-3 py-1.5 text-xs font-medium border border-border text-muted-foreground hover:bg-muted hover:text-destructive transition-colors">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${#lists.size(users) == 0}" class="flex flex-col items-center justify-center py-16 text-center">
                    <p class="text-muted-foreground">No users found.</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
