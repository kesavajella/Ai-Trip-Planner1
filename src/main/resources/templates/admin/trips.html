<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="bg-background">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Trips - intellitrip</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/output.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-background text-foreground font-sans antialiased">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/sidebar-nav :: sidebar-nav(active='dashboard')}"></div>
    <div class="flex-1 flex flex-col">
        <div th:replace="~{fragments/topbar :: topbar(title='Trips', subtitle='View and manage all trips across the platform.')}"></div>
        <div class="flex-1 px-4 py-8 md:px-8">
            <!-- Trips Table -->
            <div class="rounded-3xl border border-border bg-card overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b border-border bg-muted/50">
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">Destination</th>
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">User</th>
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">Days</th>
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">Budget</th>
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">Status</th>
                                <th class="px-5 py-4 text-left font-medium text-muted-foreground">Created</th>
                                <th class="px-5 py-4 text-right font-medium text-muted-foreground">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="trip : ${trips}" class="border-b border-border last:border-0 hover:bg-muted/30 transition-colors">
                                <td class="px-5 py-4">
                                    <div class="flex items-center gap-3">
<span class="h-10 w-10 overflow-hidden rounded-xl">
                                            <img th:src="${trip.image ?: '/images/placeholder.jpg'}" th:alt="${trip.destination}" onerror="this.onerror=null;this.src='/images/placeholder.jpg';" class="h-full w-full object-cover">
                                        </span>
                                        <div>
                                            <p class="font-medium" th:text="${trip.destination}">Destination</p>
                                            <p class="text-xs text-muted-foreground" th:text="${trip.country}">Country</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-5 py-4 text-muted-foreground" th:text="${trip.user.name}">User</td>
                                <td class="px-5 py-4" th:text="${trip.days} + ' days'">5 days</td>
                                <td class="px-5 py-4">
                                    <span class="capitalize" th:text="${trip.budget}">Moderate</span>
                                    <span class="text-muted-foreground" th:with="code=${trip.destinationCurrencyCode}" th:text="'(' + (${code != null && !code.isBlank()} ? @currencyService.formatInCurrency(trip.budgetUsd, code, userLocale) : @currencyService.format(trip.budgetUsd, userLocale)) + ')'"></span>
                                </td>
                                <td class="px-5 py-4">
                                    <span th:class="${trip.status == 'upcoming'} ? 'inline-flex items-center rounded-full border border-primary/20 bg-primary/10 px-2.5 py-0.5 text-xs font-medium text-primary capitalize' :
                                                 ${trip.status == 'completed'} ? 'inline-flex items-center rounded-full border border-accent/40 bg-accent/30 px-2.5 py-0.5 text-xs font-medium text-accent-foreground capitalize' :
                                                 'inline-flex items-center rounded-full border border-border bg-muted px-2.5 py-0.5 text-xs font-medium text-muted-foreground capitalize'" th:text="${trip.status}"></span>
                                </td>
                                <td class="px-5 py-4 text-xs text-muted-foreground" th:text="${#temporals.format(trip.createdAt, 'MMM dd, yyyy')}">Jan 01, 2025</td>
                                <td class="px-5 py-4 text-right">
                                    <form th:action="@{/admin/trips/delete/{id}(id=${trip.id})}" method="post" onsubmit="return confirm('Delete this trip?')">
                                        <button type="submit" class="inline-flex items-center rounded-full px-3 py-1.5 text-xs font-medium border border-border text-muted-foreground hover:bg-muted hover:text-destructive transition-colors">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${#lists.size(trips) == 0}" class="flex flex-col items-center justify-center py-16 text-center">
                    <p class="text-muted-foreground">No trips found.</p>
                </div>
            </div>
            <a href="/admin" class="mt-6 inline-flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground transition-colors">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Back to Admin Dashboard
            </a>
        </div>
    </div>
</div>
</body>
</html>
