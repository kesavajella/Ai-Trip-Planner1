<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="bg-background">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - intellitrip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/output.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-background text-foreground font-sans antialiased">
<div class="grid min-h-screen lg:grid-cols-2">
    <div class="flex flex-col px-6 py-8 md:px-12">
        <div th:replace="~{fragments/logo :: logo(href='/')}"></div>
        <div class="mx-auto flex w-full max-w-sm flex-1 flex-col justify-center py-12">
            <h1 class="font-serif text-4xl tracking-tight text-balance md:text-5xl">Forgot password?</h1>
            <p class="mt-3 text-pretty text-muted-foreground">Enter your email and we'll send you a reset link.</p>
            <div class="mt-8">
                <form th:action="@{/forgot-password}" method="post" class="space-y-4">
                    <div th:if="${error}" class="rounded-md bg-destructive/10 p-3 text-sm text-destructive" th:text="${error}"></div>
                    <div th:if="${success}" class="rounded-md bg-accent/20 p-3 text-sm text-accent-foreground" th:text="${success}"></div>
                    <div class="space-y-2">
                        <label for="email" class="text-sm font-medium">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required
                               class="flex h-11 w-full rounded-xl border border-input bg-background px-4 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                    </div>
                    <button type="submit" class="inline-flex w-full items-center justify-center rounded-full bg-primary px-6 py-3 text-sm font-medium text-primary-foreground hover:bg-primary/90 transition-colors">Send reset link</button>
                </form>
            </div>
            <p class="text-center text-sm text-muted-foreground">
                Remember your password? <a href="/login" class="font-medium text-foreground underline-offset-4 hover:underline">Sign in</a>
            </p>
        </div>
    </div>
    <aside class="relative hidden lg:block">
        <img src="/images/hero-travel.jpg" alt="Coastal village at golden hour" class="h-full w-full object-cover">
        <div aria-hidden class="absolute inset-0 bg-gradient-to-t from-foreground/50 to-transparent"></div>
        <div class="absolute bottom-10 left-10 right-10 max-w-md rounded-2xl border border-white/15 bg-background/85 p-5 backdrop-blur-md">
            <p class="font-serif text-xl leading-snug">"intellitrip planned the most thoughtful 9-day Greece trip I've ever taken — and saved me a weekend of tabs."</p>
        </div>
        <a href="/" class="absolute right-6 top-6 rounded-full bg-background/85 px-3 py-1.5 text-xs font-medium backdrop-blur hover:bg-background">← Back to home</a>
    </aside>
</div>
</body>
</html>
