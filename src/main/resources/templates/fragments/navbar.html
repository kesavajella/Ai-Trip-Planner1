<header th:fragment="navbar" x-data="{ scrolled: false, mobileOpen: false, profileOpen: false }"
        x-init="window.addEventListener('scroll', () => { scrolled = window.scrollY > 12 })"
        :class="scrolled ? 'border-border bg-background/85 backdrop-blur-md' : 'border-transparent bg-transparent'"
        class="sticky top-0 z-40 w-full border-b transition-colors">
    <div class="mx-auto flex h-16 w-full max-w-6xl items-center justify-between px-4 md:px-6">
        
        <!-- IntelliTrip Brand Logo & Name -->
        <a href="/" class="inline-flex items-center gap-2.5 group">
            <img src="/images/logo.png" alt="IntelliTrip Logo" class="h-10 w-10 rounded-xl object-contain shadow transition-all duration-300 group-hover:scale-105" onerror="this.src='/favicon.ico'" />
            <span class="font-serif text-[1.7rem] leading-none tracking-[-0.03em]">IntelliTrip<span class="text-primary">.</span></span>
        </a>

        <nav aria-label="Primary" class="hidden items-center gap-1 md:flex">
            <a href="#features" class="rounded-full px-4 py-2 text-sm text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">Features</a>
            <a href="#how-it-works" class="rounded-full px-4 py-2 text-sm text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">How it works</a>
            <a href="#testimonials" class="rounded-full px-4 py-2 text-sm text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">Stories</a>
            <a href="/developers" class="rounded-full px-4 py-2 text-sm text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">Makers</a>
        </nav>

        <div class="hidden items-center gap-2 md:flex">
            <div th:replace="~{fragments/theme-toggle :: theme-toggle}"></div>
            <div th:if="${user != null}" class="relative">
                <button @click="profileOpen = !profileOpen" class="flex items-center gap-2 rounded-full border border-border bg-card/80 px-1.5 py-1 pr-3 text-sm hover:bg-muted transition-colors backdrop-blur">
                    <span class="relative h-7 w-7 overflow-hidden rounded-full bg-muted flex items-center justify-center text-xs font-medium">
                        <span th:text="${#strings.substring(user.name, 0, 1)}">A</span>
                    </span>
                    <span class="font-medium" th:text="${user != null && user.name != null ? #strings.arraySplit(user.name, ' ')[0] : 'User'}">User</span>
                </button>
                <div x-show="profileOpen" @click.away="profileOpen = false" class="absolute right-0 top-full mt-2 w-48 rounded-lg border border-border bg-card py-1 shadow-lg">
                    <form th:action="@{/logout}" method="get">
                        <button type="submit" class="w-full px-4 py-2 text-left text-sm text-muted-foreground hover:bg-muted hover:text-foreground">Log out</button>
                    </form>
                </div>
            </div>
            <div th:if="${user == null}">
                <a href="/login" class="inline-flex h-9 items-center justify-center rounded-full border border-border bg-background/60 px-4 text-sm font-medium text-foreground hover:bg-muted transition-colors backdrop-blur">Log in</a>
                <a href="/signup" class="inline-flex h-9 items-center justify-center rounded-full bg-primary px-4 text-sm font-medium text-primary-foreground hover:bg-primary/90 transition-colors">Get started</a>
            </div>
        </div>

        <div class="flex items-center gap-1 md:hidden">
            <div th:replace="~{fragments/theme-toggle :: theme-toggle}"></div>
            <button @click="mobileOpen = !mobileOpen" class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-muted-foreground hover:bg-muted transition-colors" aria-label="Open menu">
                <svg x-show="!mobileOpen" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                <svg x-show="mobileOpen" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
    </div>

    <div x-show="mobileOpen" class="border-t border-border bg-background md:hidden">
        <nav class="mx-auto flex max-w-6xl flex-col px-4 py-3">
            <a href="#features" @click="mobileOpen = false" class="rounded-lg px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground">Features</a>
            <a href="#how-it-works" @click="mobileOpen = false" class="rounded-lg px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground">How it works</a>
            <a href="#testimonials" @click="mobileOpen = false" class="rounded-lg px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground">Stories</a>
            <a href="/developers" @click="mobileOpen = false" class="rounded-lg px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground">Makers</a>
            <div class="mt-2 pt-2 space-y-2" th:if="${user == null}">
                <a href="/login" @click="mobileOpen = false" class="flex w-full items-center justify-center rounded-full border border-border px-4 py-2 text-sm">Log in</a>
                <a href="/signup" @click="mobileOpen = false" class="flex w-full items-center justify-center rounded-full bg-primary px-4 py-2 text-sm text-primary-foreground">Get started</a>
            </div>
            <div class="mt-2 pt-2" th:if="${user != null}">
                <form th:action="@{/logout}" method="get">
                    <button type="submit" class="w-full rounded-lg px-3 py-2.5 text-left text-sm text-muted-foreground hover:bg-muted hover:text-foreground">Log out</button>
                </form>
            </div>
        </nav>
    </div>
</header>
