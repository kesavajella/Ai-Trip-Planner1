<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="sidebar-nav(active)" x-data="{ mobileOpen: false }">
    <!-- Mobile trigger -->
    <div class="flex h-14 items-center justify-between border-b border-border bg-background px-4 lg:hidden">
        <div th:replace="~{fragments/logo :: logo}"></div>
        <button type="button" @click="mobileOpen = true" class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-muted-foreground hover:bg-muted" aria-label="Open navigation">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
        </button>
    </div>

    <!-- Desktop sidebar -->
    <aside class="hidden h-screen w-64 shrink-0 border-r border-sidebar-border bg-sidebar text-sidebar-foreground lg:sticky lg:top-0 lg:block">
        <div class="flex h-full flex-col">
            <div class="flex h-16 items-center px-5">
                <div th:replace="~{fragments/logo :: logo}"></div>
            </div>
            <nav class="flex-1 space-y-1 px-3">
                <a th:href="@{/dashboard}" th:class="${active == 'dashboard'} ? 'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm bg-primary/10 text-primary' : 'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors'">
                    <svg class="h-[1.05rem] w-[1.05rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Overview</span>
                </a>
                <a th:href="@{/dashboard/generate}" th:class="${active == 'generate'} ? 'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm bg-primary/10 text-primary' : 'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors'">
                    <svg class="h-[1.05rem] w-[1.05rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    <span class="flex-1">AI Trip Generator</span>
                    <span class="rounded-full bg-accent/40 px-1.5 py-0.5 text-[10px] font-medium text-accent-foreground">New</span>
                </a>
                <a th:href="@{/dashboard/trips}" th:class="${active == 'trips'} ? 'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm bg-primary/10 text-primary' : 'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors'">
                    <svg class="h-[1.05rem] w-[1.05rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 12 2 12"/><path d="M12 22a10 10 0 0 0 10-10"/><path d="M12 22a10 10 0 0 1-10-10"/></svg>
                    <span>My Trips</span>
                </a>
                <a th:href="@{/dashboard/saved}" th:class="${active == 'saved'} ? 'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm bg-primary/10 text-primary' : 'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors'">
                    <svg class="h-[1.05rem] w-[1.05rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    <span>Saved Places</span>
                </a>
            </nav>
            <div class="space-y-1 px-3 pb-4">
                <a href="/" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
                    <svg class="h-[1.05rem] w-[1.05rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                    Sign out
                </a>
                <div class="mt-3 rounded-2xl border border-border bg-muted/40 p-4">
                    <p class="font-serif text-base">Upgrade to Pro</p>
                    <p class="mt-1 text-xs text-muted-foreground">Unlimited regenerations & PDF exports.</p>
                    <button class="mt-3 inline-flex w-full items-center justify-center rounded-full bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90">Upgrade</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Mobile drawer -->
    <div x-show="mobileOpen" x-cloak class="fixed inset-0 z-50 lg:hidden" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
        <div class="absolute inset-0 bg-foreground/30 backdrop-blur-sm" @click="mobileOpen = false"></div>
        <aside class="absolute left-0 top-0 h-full w-72 max-w-[80%] border-r border-sidebar-border bg-sidebar text-sidebar-foreground">
            <div class="flex justify-end p-2">
                <button type="button" @click="mobileOpen = false" class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-muted-foreground hover:bg-muted"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg></button>
            </div>
            <div class="flex h-full flex-col">
                <div class="flex h-16 items-center px-5">
                    <div th:replace="~{fragments/logo :: logo}"></div>
                </div>
                <nav class="flex-1 space-y-1 px-3">
                    <a th:href="@{/dashboard}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground"><svg class="h-[1.05rem] w-[1.05rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Overview</a>
                    <a th:href="@{/dashboard/generate}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground"><svg class="h-[1.05rem] w-[1.05rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg> AI Trip Generator</a>
                    <a th:href="@{/dashboard/trips}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground"><svg class="h-[1.05rem] w-[1.05rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 12 2 12"/><path d="M12 22a10 10 0 0 0 10-10"/><path d="M12 22a10 10 0 0 1-10-10"/></svg> My Trips</a>
                    <a th:href="@{/dashboard/saved}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted-foreground hover:bg-muted hover:text-foreground"><svg class="h-[1.05rem] w-[1.05rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg> Saved Places</a>
                </nav>
            </div>
        </aside>
    </div>
</div>
</body>
</html>
