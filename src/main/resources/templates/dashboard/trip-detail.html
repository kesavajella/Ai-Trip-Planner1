<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="bg-background">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Trip Details - ' + ${trip.destination} + ' - intellitrip'">Trip Details - intellitrip</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/output.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-background text-foreground font-sans antialiased">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/sidebar-nav :: sidebar-nav(active='trips')}"></div>
    <div class="flex min-h-screen flex-1 flex-col">
        <div th:replace="~{fragments/topbar :: topbar(title=${trip.destination}, subtitle='Trip details and full itinerary')}"></div>
        <div class="flex-1 px-4 py-8 md:px-8">
            <!-- Trip Header -->
                <div class="rounded-3xl border border-border bg-card overflow-hidden">
                    <div class="relative aspect-[21/9] overflow-hidden">
                        <img th:src="${trip.image != null && !trip.image.isBlank() ? trip.image : '/images/placeholder.jpg'}" th:alt="${trip.destination != null && !trip.destination.isBlank() ? trip.destination : 'Trip'}" onerror="this.onerror=null;this.src='/images/placeholder.jpg';" class="h-full w-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-foreground/60 to-transparent"></div>
                        <div class="absolute bottom-5 left-5 right-5">
<span th:class="${trip.status == 'upcoming'} ? 'inline-block rounded-full border border-primary/20 bg-primary/10 px-3 py-1 text-xs font-medium text-primary capitalize' : ${trip.status == 'completed'} ? 'inline-block rounded-full border border-accent/40 bg-accent/30 px-3 py-1 text-xs font-medium text-accent-foreground capitalize' : 'inline-block rounded-full border border-border bg-muted px-3 py-1 text-xs font-medium text-muted-foreground capitalize'" th:text="${trip.status != null ? trip.status : 'draft'}"></span>
                            <h1 class="mt-2 font-serif text-4xl tracking-tight text-white" th:text="${trip.destination != null && !trip.destination.isBlank() ? trip.destination : 'Untitled Trip'}"></h1>
                            <p class="text-white/80" th:text="${trip.country != null && !trip.country.isBlank() ? trip.country : ''}"></p>
                        </div>
                    </div>
                    <div class="grid gap-6 p-6 md:grid-cols-4">
                        <div>
                            <dt class="text-xs uppercase tracking-wide text-muted-foreground">Duration</dt>
                            <dd class="mt-1 text-lg font-medium" th:text="${trip.days} + ' days'"></dd>
                        </div>
                        <div>
                            <dt class="text-xs uppercase tracking-wide text-muted-foreground">Budget</dt>
                            <dd class="mt-1 text-lg font-medium capitalize" th:text="${trip.budget != null && !trip.budget.isBlank() ? trip.budget : 'N/A'}"></dd>
                        </div>
                        <div>
                            <dt class="text-xs uppercase tracking-wide text-muted-foreground">Travel Type</dt>
                            <dd class="mt-1 text-lg font-medium capitalize" th:text="${trip.travelType != null && !trip.travelType.isBlank() ? trip.travelType : 'N/A'}"></dd>
                        </div>
                        <div>
                            <dt class="text-xs uppercase tracking-wide text-muted-foreground">Total Cost</dt>
                            <dd class="mt-1 text-lg font-medium" th:with="code=${trip.destinationCurrencyCode}" th:text="${code != null && !code.isBlank() ? @currencyService.formatInCurrency(trip.budgetUsd, code, userLocale) : @currencyService.formatInCurrency(trip.budgetUsd, 'USD', userLocale)}"></dd>
                        </div>
                    </div>
                </div>

            <!-- Itinerary Section -->
<div class="mt-8" th:if="${trip.itineraryJson}"
                 x-data="{ itinerary: JSON.parse($el.dataset.itinerary), currencyCode: $el.dataset.destinationCurrencyCode || $el.dataset.currencyCode || 'USD', rate: $el.dataset.destinationCurrencyCode ? 1 : (parseFloat($el.dataset.rate || '1') || 1), userCountryCurrencyCode: $el.dataset.userCountryCurrencyCode || '', userCountryRate: parseFloat($el.dataset.userCountryRate || '1') || 1, destCurrencyCode: $el.dataset.destinationCurrencyCode || '', formatCost(amount) { var v = (Number(amount) || 0) * this.rate; try { return new Intl.NumberFormat(undefined, {style:'currency', currency: this.currencyCode, maximumFractionDigits: 0}).format(v); } catch (e) { return '$' + v; } }, formatCostInCurrency(amount, code, rate) { var v = (Number(amount) || 0) * (rate || 1); var c = code || 'USD'; try { return new Intl.NumberFormat(undefined, {style:'currency', currency: c, maximumFractionDigits: 0}).format(v); } catch (e) { return c + ' ' + v; } } }"
                 th:attr="data-itinerary=${#strings.isEmpty(trip.itineraryJson) ? '{}' : #strings.escapeXml(trip.itineraryJson)}, data-currency-code=${userCurrencyCode}, data-rate=${usdRate}, data-destination-currency-code=${trip.destinationCurrencyCode}, data-user-country-currency-code=${userCountryCurrencyCode}, data-user-country-rate=${userCountryRate}">
                <div class="mb-5 flex items-end justify-between">
                    <div>
                        <h2 class="font-serif text-3xl tracking-tight">Full Itinerary</h2>
                        <p class="mt-1 text-sm text-muted-foreground" x-text="itinerary.overview"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs uppercase tracking-wide text-muted-foreground">Total Budget</p>
                        <p class="font-serif text-2xl tracking-tight" x-text="formatCost(itinerary.totalBudget)"></p>
                        <p x-show="userCountryCurrencyCode && userCountryCurrencyCode !== destCurrencyCode" class="mt-1 text-sm font-medium text-muted-foreground" x-text="'≈ ' + formatCostInCurrency(itinerary.totalBudget, userCountryCurrencyCode, userCountryRate) + ' (' + userCountryCurrencyCode + ')'"></p>
                    </div>
                </div>
                <div class="space-y-4">
                    <template x-for="day in (itinerary.days || [])" :key="day.day">
                        <div class="rounded-3xl border border-border bg-card p-6">
                            <div class="flex items-center gap-3">
                                <span class="grid h-10 w-10 place-items-center rounded-xl bg-primary/10 text-primary font-serif text-lg" x-text="day.day"></span>
                                <div>
                                    <h3 class="font-serif text-xl" x-text="day.title || 'Day ' + day.day + ': ' + day.theme"></h3>
                                    <p class="text-sm text-muted-foreground" x-text="day.theme"></p>
                                </div>
                            </div>
                            <div class="mt-5 space-y-3">
                                <template x-for="act in (day.activities || [])" :key="act.time">
                                    <div class="flex items-start gap-4 rounded-xl bg-muted/30 p-4">
                                        <span class="text-xs font-medium text-muted-foreground min-w-[4rem]" x-text="act.time"></span>
                                        <div class="flex-1">
                                            <p class="font-medium" x-text="act.activity || act.placeName"></p>
                                            <p class="text-sm text-muted-foreground" x-text="act.description"></p>
                                        </div>
                                        <span class="text-sm font-medium" x-text="formatCost(act.estimatedCost || 0)"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

                <!-- Action Buttons -->
            <div class="mt-8 flex flex-wrap gap-3"
                 x-data="{
                     tripId: '${trip.id}',
                     tripSaved: ${trip.saved ? true : false},
                     tripStatus: '${trip.status}',
                     saving: false,
                     saveTrip() {
                         this.saving = true;
                         fetch('/api/trips/' + this.tripId + '/save', { method: 'POST' })
                             .then(r => { if (!r.ok) throw new Error('Failed'); this.tripSaved = true; })
                             .catch(() => alert('Failed to save trip'))
                             .finally(() => { this.saving = false; });
                     },
                     markCompleted() {
                         fetch('/api/trips/' + this.tripId + '/status', {
                             method: 'PUT',
                             headers: { 'Content-Type': 'application/json' },
                             body: JSON.stringify({ status: 'completed' })
                         })
                         .then(r => r.json())
                         .then(data => {
                             if (data.status) {
                                 this.tripStatus = data.status;
                             }
                         })
                         .catch(() => alert('Failed to update trip status'));
                     }
                  }">
                <button @click="saveTrip()" :disabled="tripSaved || saving" class="inline-flex items-center justify-center rounded-full border px-6 py-2.5 text-sm font-medium transition-colors"
                        :class="tripSaved ? 'border-primary/40 bg-primary/10 text-primary' : 'border-border hover:bg-muted'">
                    <svg x-show="!tripSaved" class="mr-1.5 h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1 2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    <svg x-show="tripSaved" class="mr-1.5 h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1 2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/><line x1="9" x2="15" y1="11" y2="11"/></svg>
                    <span x-text="tripSaved ? 'Trip Saved' : 'Save Trip'"></span>
                </button>
                <button @click="markCompleted()" :disabled="tripStatus === 'completed'" class="inline-flex items-center justify-center rounded-full border px-6 py-2.5 text-sm font-medium transition-colors"
                        :class="tripStatus === 'completed' ? 'border-accent/40 bg-accent/30 text-accent-foreground' : 'border-border hover:bg-muted'">
                    <svg class="mr-1.5 h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                    <span x-text="tripStatus === 'completed' ? 'Completed' : 'Mark as Completed'"></span>
                </button>
                <form th:action="@{/dashboard/trips/delete/{id}(id=${trip.id})}" method="post" onsubmit="return confirm('Delete this trip?')">
                    <button type="submit" class="inline-flex items-center justify-center rounded-full border border-destructive/30 px-6 py-2.5 text-sm font-medium text-destructive hover:bg-destructive/10 transition-colors">Delete Trip</button>
                </form>
                <a href="/dashboard/trips" class="inline-flex items-center justify-center rounded-full border border-border px-6 py-2.5 text-sm font-medium hover:bg-muted transition-colors">← Back to Trips</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
