<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="bg-background">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips - intellitrip</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/output.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-background text-foreground font-sans antialiased">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/sidebar-nav :: sidebar-nav(active='trips')}"></div>
    <div class="flex min-h-screen flex-1 flex-col">
        <div th:replace="~{fragments/topbar :: topbar(title='My Trips', subtitle=${tripsSubtitle})}"></div>
        <div class="flex-1 px-4 py-8 md:px-8">
            <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
                <a th:each="trip : ${trips}" th:href="@{/dashboard/trips/{id}(id=${trip.id})}" class="rounded-3xl border border-border bg-card overflow-hidden group transition-all hover:-translate-y-1 hover:soft-shadow-lg">
                    <div class="relative aspect-[16/10] overflow-hidden">
                        <img th:src="${trip.image ?: '/images/placeholder.jpg'}" th:alt="${trip.destination}" onerror="this.onerror=null;this.src='/images/placeholder.jpg';" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                        <span th:class="${trip.status == 'upcoming'} ? 'absolute left-3 top-3 rounded-full border border-primary/20 bg-primary/10 px-2.5 py-0.5 text-xs font-medium text-primary capitalize' : ${trip.status == 'completed'} ? 'absolute left-3 top-3 rounded-full border border-accent/40 bg-accent/30 px-2.5 py-0.5 text-xs font-medium text-accent-foreground capitalize' : 'absolute left-3 top-3 rounded-full border border-border bg-muted px-2.5 py-0.5 text-xs font-medium text-muted-foreground capitalize'" th:text="${trip.status}"></span>
                    </div>
                    <div class="p-5">
                        <h3 class="font-serif text-2xl leading-tight tracking-tight" th:text="${trip.destination}"></h3>
                        <p class="mt-0.5 text-sm text-muted-foreground" th:text="${trip.country}"></p>
                        <div class="mt-5 grid grid-cols-3 gap-3">
                            <div><dt class="text-[11px] uppercase tracking-wide text-muted-foreground">Days</dt><dd class="mt-0.5 text-sm font-medium" th:text="${trip.days}"></dd></div>
                            <div><dt class="text-[11px] uppercase tracking-wide text-muted-foreground">Budget</dt><dd class="mt-0.5 text-sm font-medium capitalize" th:text="${trip.budget}"></dd></div>
                            <div><dt class="text-[11px] uppercase tracking-wide text-muted-foreground">Type</dt><dd class="mt-0.5 text-sm font-medium capitalize" th:text="${trip.travelType}"></dd></div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
